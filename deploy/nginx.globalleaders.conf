# globalleaders.live — HTTPS sonlandırma + webhook yönlendirmesi
#
# İlk sertifika (tek seferlik):
#   docker compose run --rm --entrypoint certbot certbot certonly --webroot \
#     -w /var/www/certbot -d globalleaders.live -d www.globalleaders.live \
#     --email siz@ornek.com --agree-tos --no-eff-email
#   docker compose restart nginx

server {
    listen 80;
    server_name globalleaders.live www.globalleaders.live;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://globalleaders.live$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.globalleaders.live;
    ssl_certificate     /etc/letsencrypt/live/globalleaders.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalleaders.live/privkey.pem;
    return 301 https://globalleaders.live$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name globalleaders.live;

    ssl_certificate     /etc/letsencrypt/live/globalleaders.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalleaders.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;   # reklam görselleri (data URL ile ≤ 8MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Stripe webhook'u: gövde HAM geçmeli, proxy tamponu kapatılır.
    location = /api/webhooks/stripe {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # SSE (canlı oy akışı): tampon kapatılır, uzun zaman aşımı.
    location = /api/stream {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
