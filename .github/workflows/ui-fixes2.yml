name: UI hardening
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-ui-hardening.js
      - name: Commit UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/css/style.css
          git diff --cached --quiet || (git commit -m 'fix: responsive UI hardening' && git push)
