name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server/index.js
      - run: node --check server/api.js
      - run: node --check server/admin.js
      - run: node --check server/core.js
      - run: node --check server/db.js
      - run: node --check server/services/fraud.js
      - run: node --check server/services/sse.js
      - run: node --check server/services/payments.js
      - run: node --check server/services/payment-fulfillment.js
      - run: npm run build:react
      - name: Commit generated React bundle
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- public/js/react-app.js; then
            echo "React bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/react-app.js
          git commit -m "build: refresh React bundle [skip ci]"
          git push
      - run: npm test
