# Global Leaders Live — tek komutla üretim kurulumu.
#
#   cp .env.example .env && nano .env     # şifreler + cüzdan + Stripe anahtarları
#   docker compose up -d --build
#
# HTTPS, sağdaki nginx konteynerinde Let's Encrypt sertifikasıyla sağlanır
# (bkz. deploy/nginx.globalleaders.conf ve deploy/DEPLOY.md).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      GL_DB_FILE: /data/globalleaders.db
      PORT: 3000
    volumes:
      - gl-data:/data                # SQLite veritabanı (kalıcı)
      - gl-uploads:/app/public/uploads # reklam görselleri (kalıcı)
    expose:
      - "3000"
    networks: [web]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.globalleaders.conf:/etc/nginx/conf.d/default.conf:ro
      - gl-certs:/etc/letsencrypt
      - gl-certbot-www:/var/www/certbot
    networks: [web]

  # Sertifika yenileme: günde 2 kez kontrol eder, gerekiyorsa yeniler ve nginx'i bilgilendirir.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    volumes:
      - gl-certs:/etc/letsencrypt
      - gl-certbot-www:/var/www/certbot
    networks: [web]

volumes:
  gl-data:
  gl-uploads:
  gl-certs:
  gl-certbot-www:

networks:
  web:
